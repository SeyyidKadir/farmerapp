plugins { id 'com.android.application' }

android {
    namespace 'dev.local.farmerapp'
    compileSdk 34

    defaultConfig {
        applicationId "dev.local.farmerapp"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

/* Bilerek bos. AppCompat eski kotlin-stdlib-jdk7/jdk8 paketlerini getiriyor;
   Kotlin 1.8'den beri o siniflar ana stdlib'e tasindigi icin ayni sinif iki kez
   geliyor ve derleme "Duplicate class" ile dusuyor. Bir WebView sarmalayicisinin
   androidx'e ihtiyaci yok. */
dependencies { }
